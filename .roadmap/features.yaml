# .roadmap/features.yaml — 功能台账
# 本文件是该项目功能状态的唯一事实源;yPulse 定期采集(schema v1,见 yPulse 仓库 docs/feature-ledger.md)。
# 约定:完成一个功能 = 同一次提交里更新对应条目(置 done + completedAt)。
#
# 2026-10-01 建账:项目从 yDesktopTemplate v0.2.0 起步,仪器从 yLookbook 的 sections/isobath 移植。
# 继承自模板、未经改动的外壳能力合并记在「窗口与系统」「工程化」两组里,细节见模板自己的台账。

project: maosensen/yIsobath
track: personal
launchedAt: null
areas: [测量, 仪器, 回收, 窗口与系统, 更新与发布, 工程化]

modules:
  - id: runnable-app
    title: 可构建并启动的桌面应用
    tier: required
    status: done
    completedAt: 2026-10-01
    note: pnpm tauri dev 起得来;本机 WKWebView 里 WebGL2 拿到 Apple GPU、浮点缓冲与 4× MSAA,174 万文件的测量画面 60 fps。
  - id: selected-design
    title: 仪器式界面(阶梯浮雕 + 四种读法 + 可回收面板)
    tier: required
    status: done
    completedAt: 2026-10-01
  - id: daily-use
    title: 日常拿来清理自己的 Mac
    tier: required
    status: doing
    note: 第一版能测、能看、能移到废纸篓;还没有在整块数据卷 + 完全磁盘访问权限下长期使用过。
  - id: signed-release
    title: Developer ID 签名 + 公证的安装包与自动更新
    tier: required
    status: todo
    note: 完全磁盘访问权限按签名身份记;签名不稳定的话每次更新都要重新授权。启用步骤见 .claude/release.md。
  - id: tagged-release
    title: GitHub Release 与 CHANGELOG
    tier: required
    status: todo

features:
  # —— 测量 ——
  - id: native-survey
    title: 原生测量整块数据卷、家目录或任意文件夹
    area: 测量
    status: done
    completedAt: 2026-10-01
    note: |
      Rust 并行走盘(rayon,线程数为核数 × 2,8–32),只读名字、占用、修改时间,不打开文件内容。
      占用按实际分配的块算(稀疏的 Docker.raw、被 iCloud 移走的文件按真实占用),多个硬链接只算一次;
      只测一块卷(别的设备、autofs 挂载点跳过并计数);列不出的目录计数显示。macOS 上「整块盘」走数据卷
      /System/Volumes/Data,避免 firmlink 重复计数。~/github(174 万文件、20 万目录、160 GB)release 版 13 s,
      总量与 du 一致。进度每 120 ms 经 Channel 推给界面,可「停下并显示」或取消。
  - id: survey-folding
    title: 按节点预算折叠,画得动整块盘
    area: 测量
    status: done
    completedAt: 2026-10-01
    note: |
      完整的树留在 Rust 内存里,发给界面的是折叠后的树:不到阈值 T 的目录折成一块(仍是真路径,能显示、能移到
      废纸篓,要进去就按需展开,见 lazy-expand),带规则记号或装着足够可回收内容的小目录照样展开;T 从 max(1 MB, 总量 / 10⁶) 起倍增到不超过
      6 万个节点。字节守恒有单测。~/github 折成 3.8 万个节点、4.2 MB JSON。
  - id: lazy-expand
    title: 钻进折叠的目录时按需展开
    area: 测量
    status: done
    completedAt: 2026-10-01
    note: |
      点进折叠的块(或选中按回车),expand_folder 从 Rust 内存里的完整树把它按自己的尺度重折(像单独测了它,
      2 万个节点的预算),整份测量重发、replaceVolume 换卷后钻进去,不重新走盘。展开过的目录记在 Survey.expanded
      (名字树),移到废纸篓之后仍展开;只给展开后不止一块的目录(expandable)。没做「只发子树、局部替换」:
      ~/github(3.8 万个节点)上实测从回车到换卷,dev 构建 234 ms、推算正式版约 75 ms,够快。
  - id: survey-snapshots
    title: 测量快照与两次对比(上次以来哪里涨了)
    area: 测量
    status: todo

  # —— 仪器 ——
  - id: relief-instrument
    title: 阶梯浮雕仪器(从 yLookbook 移植)
    area: 仪器
    status: done
    completedAt: 2026-10-01
    note: |
      yLookbook sections/isobath 的引擎、WebGL2 管线、标注层与面板整体搬进 src/instrument/,字体换成 fontsource。
      为 WKWebView 改过:分段条不用浮动的 legend(WebKit 不让它排进同一行);折叠的目录用暗玻璃材质;
      文件夹测量的读数写 of survey;轮毂第二行放不下时只留文件数;引线标签按两行里宽的那行避让左栏;
      年龄中位数的插值收到子树里真实的最新 / 最老时间(原版刚建的文件会显示「7 周」)。
  - id: demo-volume
    title: 演示卷
    area: 仪器
    status: done
    completedAt: 2026-10-01
    note: 启动时回放一份生成的测量记录(明确标着 demo),菜单里随时回到它。

  # —— 回收 ——
  - id: reclaim-rules
    title: 可回收空间规则与风险等级
    area: 回收
    status: done
    completedAt: 2026-10-01
    note: |
      沿用 yLookbook 的 14 条规则(风险:重新生成 / 需要判断 / 不可逆,带清理命令)。Rust 端按名字打记号:
      node_modules、DerivedData、有 src 的 dist / out / build、有 Cargo.toml 的 target、各家缓存、废纸篓;
      原生新增 pnpm store / ~/.cargo/registry / ~/.gradle/caches / ~/.bun/install/cache、Xcode Previews、
      一年以上的 DeviceSupport、Docker.raw;安装包只认 Downloads / Desktop 里的;重复只按同名同大小(≥ 50 MB)。
  - id: trash-action
    title: 移到废纸篓
    area: 回收
    status: done
    completedAt: 2026-10-01
    note: |
      焦点面板的操作条、右键菜单、⌘⌫,都先弹确认(路径、大小、命中的规则与风险,默认焦点在取消上)。
      Rust 端只接受当前测量里的路径,拒绝测量的根、系统与账户依赖的目录(/System、/usr、~/Library、~/Documents……)
      和已在废纸篓里的东西;macOS 走 NSFileManager。移走后在内存里的树上更新、原地重画不跳视角;家目录或整块盘的
      测量里,这块字节挪进 ~/.Trash(清空废纸篓才真正腾出空间)。
  - id: reveal-copy
    title: 在访达中显示、复制路径、右键菜单
    area: 回收
    status: done
    completedAt: 2026-10-01
    note: 零散小文件那一块的操作落到它所在的目录;复制出去的路径经过 firmlink(/Users/…,不是 /System/Volumes/Data/…)。
  - id: content-dedupe
    title: 按内容哈希确认重复文件
    area: 回收
    status: todo
  - id: run-cleanup-commands
    title: 预览后代跑清理命令
    area: 回收
    status: todo

  # —— 窗口与系统 ——
  - id: full-disk-access-guide
    title: 完全磁盘访问权限的事前说明与无权限计数
    area: 窗口与系统
    status: done
    completedAt: 2026-10-01
    note: 测整块盘或家目录前,没有权限就先说明会发生什么(会被问哪些、哪些会跳过),给打开系统设置的按钮;测完显示列不出的目录数。权限检测靠能否打开 TCC.db,不会触发授权弹窗。
  - id: desktop-shell
    title: 桌面外壳(继承自 yDesktopTemplate v0.2.0)
    area: 窗口与系统
    status: done
    completedAt: 2026-10-01
    note: 单实例、窗口位置记忆、叠加式标题栏(红绿灯放在顶栏正中的高度,顶栏可拖动 / 双击缩放)、前端日志落盘。窗口改为不透明(仪器铺满整个窗口,用不上毛玻璃)。

  # —— 更新与发布 ——
  - id: self-update
    title: 自动更新
    area: 更新与发布
    status: todo
    note: 接线随模板而来,pubkey 还是占位(endpoint 已指向 maosensen/yIsobath);第一次发版时启用。
  - id: release-pipeline
    title: 四平台发布流水线
    area: 更新与发布
    status: todo
    note: release.yml 随模板而来,Apple 签名与公证的 secrets 尚未配置。

  # —— 工程化 ——
  - id: quality-gate
    title: 一体化质量门禁与双端测试
    area: 工程化
    status: done
    completedAt: 2026-10-01
    note: pnpm check(typecheck + biome + vitest + bindings 漂移 + rustfmt + clippy)。Rust 20 个单测覆盖分类、记号、折叠守恒、硬链接、停止 / 取消、废纸篓守护;前端 Vitest 覆盖卷模型与原生测量的路径。
  - id: dev-switches
    title: 开发开关与命令行测量
    area: 工程化
    status: done
    completedAt: 2026-10-01
    note: YISOBATH_SURVEY=volume|home|/abs/path 启动即测、YISOBATH_PERF=1 每 5 秒把帧时间写进日志(只在 debug 构建生效);cargo run --release --example survey -- <path> 不开界面量走盘速度与折叠结果。
