# .roadmap/features.yaml — 功能台账
# 本文件是该项目功能状态的唯一事实源;yPulse 定期采集(schema v1,见 yPulse 仓库 docs/feature-ledger.md)。
# 约定:完成一个功能 = 同一次提交里更新对应条目(置 done + completedAt)。
#
# 初稿由功能考古生成(2026-07-28;modules 自 readiness DB 迁移,原样保留),待人批改。

project: maosensen/yDesktopTemplate
track: oss
launchedAt: null
areas: [窗口外壳, 界面与主题, IPC 与安全, 应用骨架, 更新与发布, 工程化]

modules:
  - id: readme-hero
    title: README 首屏:一句话价值 + 视觉
    tier: required
    status: todo
    note: 截图或 GIF 放在首屏。这就是全部的第一印象。
  - id: runnable-demo
    title: 能跑起来的 Demo
    tier: required
    status: todo
    note: 在线试用链接,或一条在干净机器上就能成功的命令。
  - id: quickstart-5min
    title: 快速上手 5 分钟内成功
    tier: required
    status: todo
    note: 拿全新 clone 掐表走一遍。每多一步都会劝退一批人。
  - id: license
    title: LICENSE
    tier: required
    status: todo
  - id: designed-facade
    title: 门面看得出是设计过的
    tier: required
    status: todo
    note: 落地页,或真正做过样式的 README。「惊艳」本身就是目的。
  - id: tagged-release
    title: 打了 tag 的正式发布 + CHANGELOG
    tier: required
    status: done
    completedAt: 2026-07-10
    note: 一个没有 release 的仓库,读起来就是弃坑了。v0.1.0 起有 tag + GitHub Release + CHANGELOG(对账 2026-07-28 按事实补记)。
  - id: contributing-guide
    title: 贡献指南 + Issue 模板
    tier: required
    status: todo
    note: 别让第一个外部贡献者卡在猜规则上。
  - id: launch-assets
    title: 首发素材已备好
    tier: required
    status: todo
    note: 封面图 + 介绍文案,在发布当天之前就写完。
  - id: actually-announced
    title: 真的对外发出去了
    tier: required
    status: todo
    note: 发到目标用户所在的地方。不推广 = 项目不存在。
  - id: docs-site
    title: 文档站
    tier: enhancement
    status: todo
  - id: i18n-readme
    title: 多语言 README
    tier: enhancement
    status: todo
  - id: ci-badges
    title: CI + 测试徽章
    tier: enhancement
    status: todo
  - id: example-project
    title: 示例项目
    tier: enhancement
    status: todo
  - id: community-channel
    title: 社区频道
    tier: enhancement
    status: todo
  - id: code-signing
    title: 代码签名 + 公证
    tier: required
    status: todo
    note: 未签名的桌面包会弹一个没人敢点「继续」的警告。
  - id: platform-installers
    title: 各目标平台的安装包
    tier: required
    status: todo
  - id: auto-update-channel
    title: 自动更新通道
    tier: enhancement
    status: todo
  - id: crash-reporting
    title: 崩溃上报
    tier: enhancement
